<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>Meniu | Cafeneaua Aroma</title>
    <style>
      :root {
        --fundal-pagina: #e1ebef;
        --fundal-card: #ffffff;
        --culoare-principala: #26637a;
        --culoare-accent: #8be1d4;
        --text-principal: #2d2c2c;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background-color: var(--fundal-pagina);
        color: var(--text-principal);
      }
      header {
        background-color: var(--fundal-card);
        border-bottom: 3px solid var(--culoare-accent);
        padding: 16px 30px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: Georgia, serif;
        font-weight: bold;
        font-size: 1.2rem;
        color: #7d482c;
        margin-bottom: 14px;
      }
      .logo-icon {
        width: 34px;
        height: 34px;
        background-color: #623923;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-icon::after {
        content: "";
        width: 14px;
        height: 20px;
        background-color: #daa23c;
        border-radius: 50%;
      }

      nav a {
        text-decoration: none;
        color: var(--culoare-principala);
        font-weight: bold;
        margin-right: 22px;
        padding-bottom: 4px;
        font-size: 0.95rem;
      }
      nav a.activ {
        border-bottom: 3px solid var(--culoare-accent);
      }

      main {
        padding: 25px 30px;
        max-width: 700px;
      }

      h1,
      h2,
      .card h3 {
        font-family: Georgia, serif;
        color: var(--culoare-principala);
      }

      h1 {
        font-size: 2rem;
        margin-top: 0;
        margin-bottom: 20px;
      }

      h2 {
        font-size: 1.35rem;
        margin-bottom: 14px;
      }

      .card {
        background-color: var(--fundal-card);
        padding: 20px 24px;
        border-radius: 12px;
        box-shadow: 0 4px 12px rgb(0 0 0 / 0.06);
        margin-bottom: 16px;
      }

      .card h3 {
        margin-top: 0;
        margin-bottom: 8px;
        font-size: 1.15rem;
      }

      .card p {
        margin: 8px 0;
        font-size: 0.95rem;
      }

      .pret {
        font-weight: bold;
        color: var(--culoare-principala);
        margin-top: 12px;
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <span class="logo-icon"></span>
        <span>Aroma</span>
      </div>
      <nav>
        <a href="#">Acasă</a>
        <a href="#" class="activ">Meniu</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <main>
      <h1>Meniul nostru</h1>
      <h2>Cafea</h2>

      <article class="card">
        <h3>Espresso</h3>
        <p>Shot scurt și intens, din boabe prăjite local.</p>
        <p class="pret">9 lei</p>
      </article>

      <article class="card">
        <h3>Flat white</h3>
        <p>Espresso dublu cu lapte catifelat.</p>
        <p class="pret">14 lei</p>
      </article>
    </main>
  </body>
</html>
