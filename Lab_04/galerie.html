<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galerie</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #ffffff;
        color: #111111;
        padding: 30px 40px;
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
      }

      h1 {
        font-size: 26px;
        margin-bottom: 20px;
      }
      .galerie {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 140px;
        gap: 12px;
      }
      .galerie img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
        display: block;
      }
      .galerie img.mare {
        grid-column: span 2;
        grid-row: span 2;
      }
      .galerie img.lata {
        grid-column: span 2;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Galerie</h1>

      <div class="galerie">
        <img class="mare" src="cafenea.jpg" alt="Cafenea" />
        <img src="espresso.jpg" alt="Espresso" />
        <img src="flat-white.jpg" alt="Flat white" />
        <img src="latte.jpg" alt="Latte cu caramel" />
        <img src="cheesecake.jpg" alt="Cheesecake" />
        <img class="lata" src="croissant.jpg" alt="Croissant" />
        <img src="briosa.jpg" alt="Brioșă cu afine" />
        <img src="ceai.jpg" alt="Ceai verde" />
      </div>
    </main>
  </body>
</html>
