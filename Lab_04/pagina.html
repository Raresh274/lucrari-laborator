<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagină cu bară laterală</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background-color: #f3ede4;
        color: #222222;
        display: grid;
        grid-template-columns: 200px 1fr;
        grid-template-rows: auto 1fr auto;
        grid-template-areas:
          "header header"
          "aside  main"
          "footer footer";
      }

      header {
        grid-area: header;
        background-color: #63391f;
        color: #ffffff;
        padding: 18px 30px;
      }

      header h1 {
        margin: 0;
        font-size: 20px;
      }

      aside {
        grid-area: aside;
        padding: 25px 20px 25px 30px;
        position: sticky;
        top: 20px;
        align-self: start;
      }

      aside h2 {
        margin: 0 0 15px 0;
        font-size: 18px;
      }

      aside nav {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      aside a {
        color: #1a0dab;
        font-size: 14px;
      }

      main {
        grid-area: main;
        padding: 25px 30px 25px 10px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        align-content: start;
      }

      .produs {
        background-color: #ffffff;
        border-radius: 10px;
        padding: 14px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      }

      /* Forțează toate imaginile din main să stea la 140px înălțime */
      main img {
        width: 100%;
        height: 140px;
        object-fit: cover;
        border-radius: 6px;
        display: block;
        margin-bottom: 12px;
      }

      .produs h3 {
        margin: 0 0 6px 0;
        font-size: 16px;
      }

      .produs .pret {
        margin: 0;
        font-size: 14px;
        font-weight: bold;
        color: #63391f;
      }

      footer {
        grid-area: footer;
        background-color: #2e2118;
        color: #e6dcd5;
        text-align: center;
        padding: 16px;
        font-size: 13px;
      }

      footer p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Cafeneaua Aroma — Meniu</h1>
    </header>

    <aside>
      <h2>Categorii</h2>
      <nav>
        <a href="#">Cafea</a>
        <a href="#">Ceai</a>
        <a href="#">Desert</a>
      </nav>
    </aside>

    <main>
      <div class="produs">
        <img src="espresso.jpg" alt="Espresso" />
        <h3>Espresso</h3>
        <p class="pret">9 lei</p>
      </div>

      <div class="produs">
        <img src="flat-white.jpg" alt="Flat white" />
        <h3>Flat white</h3>
        <p class="pret">14 lei</p>
      </div>

      <div class="produs">
        <img src="latte.jpg" alt="Latte" />
        <h3>Latte</h3>
        <p class="pret">16 lei</p>
      </div>

      <div class="produs">
        <img src="ceai.jpg" alt="Ceai verde" />
        <h3>Ceai verde</h3>
        <p class="pret">10 lei</p>
      </div>

      <div class="produs">
        <img src="cheesecake.jpg" alt="Cheesecake" />
        <h3>Cheesecake</h3>
        <p class="pret">18 lei</p>
      </div>

      <div class="produs">
        <img src="croissant.jpg" alt="Croissant" />
        <h3>Croissant</h3>
        <p class="pret">8 lei</p>
      </div>
    </main>

    <footer>
      <p>© 2026 Cafeneaua Aroma</p>
    </footer>
  </body>
</html>
