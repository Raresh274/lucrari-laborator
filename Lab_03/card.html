<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>Card</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2ece4;
        padding: 20px;
      }
      .card {
        width: 280px;
        background-color: #ffffff;
        padding: 20px;
        border-radius: 12px; /* colțuri rotunjite */
        box-shadow: 0 4px 16px rgb(0 0 0 / 0.12); /* umbră */
      }
      .card h3 {
        margin-top: 0;
        color: #6b3e26;
      }
      .pret {
        font-weight: bold;
        color: #6b3e26;
      }
      .card {
        width: 280px;
        background-color: #ffffff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 16px rgb(0 0 0 / 0.12);
        margin-bottom: 16px;
      }
    </style>
  </head>

  <body>
    <article class="card">
      <h3>Espresso</h3>
      <p>Shot scurt și intens.</p>
      <p class="pret">9 lei</p>
    </article>
    <article class="card">
      <h3>Flat white</h3>
      <p>Espresso dublu cu lapte catifelat.</p>
      <p class="pret">14 lei</p>
    </article>
    <article class="card">
      <h3>Latte cu caramel</h3>
      <p>Recomandarea casei.</p>
      <p class="pret">16 lei</p>
    </article>
  </body>
</html>
