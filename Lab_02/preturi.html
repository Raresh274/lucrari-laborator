<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <h1>Prețuri băuturi</h1>
    <title>Tabel</title>
    <!-- doar ca să vedem marginile celulelor; CSS îl învățăm în Lucrarea 3 -->
    <style>
      table,
      th,
      td {
        border: 1px solid #999;
        border-collapse: collapse;
        padding: 6px;
      }
    </style>
  </head>
  <body>
    <table>
      <caption>
        Prețuri pe mărimi (RON)
        <br />
      </caption>
      <thead>
        <tr>
          <th scope="col">Produs</th>
          <th scope="col">Mic</th>
          <th scope="col">Mediu</th>
          <th scope="col">Mare</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Espresso</th>
          <td>9</td>
          <td>11</td>
          <td>13</td>
        </tr>
        <tr>
          <th scope="row">Flat white</th>
          <td>12</td>
          <td>14</td>
          <td>17</td>
        </tr>
        <tr>
          <th scope="row">Ciocolată caldă</th>
          <td>14</td>
          <td>16</td>
          <td>19</td>
        </tr>
        <tr>
          <th scope="row">Latte cu caramel</th>
          <td>12</td>
          <td>14</td>
          <td>17</td>
        </tr>

        <tr>
          <th scope="row">Ceai</th>
          <td colspan="3">10 lei - o singură mărime</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
